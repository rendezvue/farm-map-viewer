<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FARMILY 작물 맵</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">

      <!-- ── TopBar ─────────────────────────────────────────────────────── -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-logo">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
              <rect width="22" height="22" rx="6" fill="url(#tbar-lg)"/>
              <defs>
                <linearGradient id="tbar-lg" x1="0" y1="0" x2="22" y2="22">
                  <stop stop-color="#2a9a45"/>
                  <stop offset="1" stop-color="#45d46a"/>
                </linearGradient>
              </defs>
              <path d="M6 15L10 8L14 12L16 9" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="16" cy="9" r="1.5" fill="white"/>
            </svg>
            <span class="topbar-brand">FARMILY</span>
          </div>
          <div class="topbar-divider"></div>
          <nav class="topbar-nav" id="topbarNav">
            <button class="topbar-tab is-active" data-nav="crop" type="button">작물 탭</button>
            <button class="topbar-tab" data-nav="analysis" type="button">분석</button>
            <button class="topbar-tab" data-nav="report" type="button">리포트</button>
            <button class="topbar-tab" data-nav="settings" type="button">설정</button>
          </nav>
        </div>
        <div class="topbar-right">
          <span class="topbar-url">lab.farmily.ai:8090</span>
          <div class="topbar-avatar" aria-label="사용자">F</div>
        </div>
      </header>

      <!-- ── Content area ───────────────────────────────────────────────── -->
      <div class="content-area">

        <!-- ── 왼쪽 사이드바 ─────────────────────────────────────────────── -->
        <aside class="sidebar">

          <!-- 1. AI 검출 현황 -->
          <section class="panel panel-crop panel-primary" id="cropPanel">
            <div class="panel-head panel-head-toggle" id="cropPanelHead">
              <h2>AI 검출 현황</h2>
              <div class="panel-head-right">
                <span class="ai-badge">AI 분석</span>
                <button class="panel-collapse-btn" id="cropCollapseBtn" type="button" aria-expanded="true">▾</button>
              </div>
            </div>
            <div class="panel-body" id="cropPanelBody">
              <div class="crop-session-label" id="cropSessionLabel">세션 검출량 (-)</div>
              <div class="crop-overview" id="cropOverview"></div>
              <div class="crop-stats" id="cropStats"></div>
              <div class="crop-chart-wrap">
                <div class="crop-chart-title">최근 30일 추이</div>
                <div id="cropChart" class="crop-chart"></div>
                <div class="crop-chart-legend" id="cropChartLegend"></div>
              </div>
            </div>
          </section>

          <!-- 2. 순찰 기록 (세션 선택) -->
          <section class="panel panel-session">
            <div class="panel-head">
              <h2>순찰 기록</h2>
              <span class="session-status" id="datasetSummary">로딩 중…</span>
            </div>
            <div id="deviceTabs"></div>
            <div class="session-list" id="sessionList"></div>
          </section>

          <div class="sidebar-report">
            <button id="reportButton" type="button" class="report-btn">리포트 생성</button>
          </div>

          <!-- 3. 표시한 구간 (북마크) -->
          <section class="panel panel-bookmarks" id="bookmarksPanel">
            <div class="panel-head">
              <h2>표시한 구간</h2>
              <span class="pill" id="bookmarkCountPill">0</span>
            </div>
            <div class="bookmark-list" id="bookmarkList">
              <p class="panel-empty">선택한 위치가 없습니다</p>
            </div>
          </section>

          <!-- 알림 패널 -->
          <section class="panel panel-alerts" id="alertsPanel" hidden>
            <div class="panel-head">
              <h2>Alerts</h2>
              <span class="pill" id="alertCountPill">0</span>
            </div>
            <div class="alert-list" id="alertList"></div>
          </section>

        </aside>

        <!-- ── 맵 스테이지 ────────────────────────────────────────────────── -->
        <main class="map-stage">
          <section class="map-card">
            <div id="mapViewport" class="map-viewport">
              <div id="tilePane" class="tile-pane"></div>
              <div id="detailPane" class="detail-pane"></div>
              <div id="annotationPane" class="annotation-pane"></div>
              <div id="markerPane" class="marker-pane"></div>
              <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
              <div id="segmentTooltip" class="segment-tooltip" hidden></div>
              <div class="map-topline">
                <div class="map-resource-hud" id="mapCropLegend"></div>
              </div>
              <div class="map-control-stack" aria-label="지도 컨트롤">
                <button id="mapZoomIn" class="map-icon-btn" type="button" aria-label="확대">+</button>
                <button id="mapZoomOut" class="map-icon-btn" type="button" aria-label="축소">−</button>
                <button id="mapFit" class="map-icon-btn map-fit-btn" type="button" aria-label="전체 보기">□</button>
              </div>
              <div class="hud">
                <div class="hud-card">
                  <span class="hud-label">Zoom</span>
                  <strong id="zoomValue">-</strong>
                </div>
                <div class="hud-card">
                  <span class="hud-label">Scale</span>
                  <strong id="scaleValue">-</strong>
                </div>
              </div>
              <div class="map-vertical-scrollbar" id="mapVerticalScrollbar" role="scrollbar" aria-label="지도 세로 이동" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
                <button class="map-scroll-arrow map-scroll-arrow-up" id="mapScrollUp" type="button" aria-label="위로 이동"></button>
                <div class="map-scroll-track" id="mapScrollTrack">
                  <div class="map-scroll-thumb" id="mapScrollThumb"></div>
                </div>
                <button class="map-scroll-arrow map-scroll-arrow-down" id="mapScrollDown" type="button" aria-label="아래로 이동"></button>
              </div>
              <div class="map-horizontal-scrollbar" id="mapHorizontalScrollbar" role="scrollbar" aria-label="지도 좌우 이동" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
                <button class="map-scroll-arrow map-scroll-arrow-left" id="mapScrollLeft" type="button" aria-label="왼쪽 이동"></button>
                <div class="map-scroll-track" id="mapHorizontalScrollTrack">
                  <div class="map-scroll-thumb" id="mapHorizontalScrollThumb"></div>
                </div>
                <button class="map-scroll-arrow map-scroll-arrow-right" id="mapScrollRight" type="button" aria-label="오른쪽 이동"></button>
              </div>
              <div class="rts-command-console" aria-label="전술 지휘 콘솔">
                <div class="rts-minimap-panel">
                  <canvas id="rtsMiniMapCanvas" class="rts-minimap-canvas"></canvas>
                  <div class="rts-panel-caption">TACTICAL MAP</div>
                </div>
                <div class="rts-info-panel" id="rtsInfoPanel">
                  <div class="rts-info-kicker">SELECTED TARGET</div>
                  <strong id="rtsInfoTitle">-</strong>
                  <div class="rts-info-grid">
                    <span>Rail</span><b id="rtsInfoRail">-</b>
                    <span>Position</span><b id="rtsInfoPosition">-</b>
                    <span>Status</span><b id="rtsInfoStatus">Awaiting data</b>
                  </div>
                  <div class="rts-detection-panel">
                    <div class="rts-detection-head">
                      <span>DETECTION RESULTS</span>
                      <b id="rtsDetectionScope">-</b>
                    </div>
                    <div class="rts-detection-chart" id="rtsDetectionChart"></div>
                  </div>
                </div>
                <div class="rts-command-panel" aria-label="지도 레이어 선택">
                  <div class="map-layer-selector" id="mapLayerSelector" aria-label="지도 레이어 선택"></div>
                </div>
              </div>
            </div>
          </section>
        </main>

        <!-- ── 우측 패널: 선택 + 레이어 + 오늘 할 일 ─────────────────── -->
        <aside class="right-panel" id="rightPanel" data-active-panel="tasks">
          <div class="inspector-tabs" id="inspectorTabs">
            <button class="inspector-tab" data-panel="selection" type="button">선택</button>
            <button class="inspector-tab" data-panel="layers" type="button">레이어</button>
            <button class="inspector-tab is-active" data-panel="tasks" type="button">작업</button>
          </div>

          <!-- 선택 프레임 패널 -->
          <section class="panel panel-selection" id="selectionPanel" hidden>
            <div class="panel-head">
              <h2>선택 위치</h2>
              <span class="pill" id="selectionPill">-</span>
            </div>
            <div class="selection-meta" id="selectionMeta"></div>
            <img id="contactSheet" class="contact-sheet" hidden alt="contact sheet" />
            <div class="selection-actions">
              <button id="timelapseBtn" class="timelapse-btn" type="button">타임랩스 보기</button>
            </div>
            <div id="selectionInsights" class="selection-insights" hidden></div>
            <div id="cameraGrid" class="camera-grid"></div>
          </section>

          <section class="panel panel-layers" id="layersPanel" hidden>
            <div class="panel-head">
              <h2>맵 오버레이 레이어</h2>
              <span class="ai-badge">AI 분석</span>
            </div>
            <div class="layers-list" id="layersList"></div>
            <div class="layer-legend" id="layerLegend"></div>
            <div class="layer-summary" id="layerSummary" hidden></div>
            <div id="segmentDetail" class="segment-detail" hidden></div>
          </section>

          <section class="panel panel-tasks" id="tasksPanel" hidden>
            <div class="panel-head">
              <h2>오늘의 추천 조치</h2>
              <div class="panel-head-right">
                <div class="live-badge">
                  <div class="live-dot"></div>
                  <span>LIVE</span>
                </div>
                <span class="pill" id="taskCountPill">0</span>
              </div>
            </div>
            <div class="task-mission" id="taskMission"></div>
            <div class="task-filter-row" id="taskFilterRow">
              <button class="task-filter-btn is-active" data-filter="active" type="button">미완료</button>
              <button class="task-filter-btn" data-filter="all" type="button">전체</button>
              <button class="task-filter-btn" data-filter="done" type="button">완료</button>
            </div>
            <div class="task-list" id="taskList"></div>
          </section>
        </aside>

      </div><!-- /.content-area -->
    </div><!-- /.app-shell -->

    <!-- 리포트 모달 -->
    <div id="reportModal" class="report-modal" hidden>
      <div class="report-modal-backdrop" id="reportBackdrop"></div>
      <div class="report-modal-content" id="reportContent">
        <div class="report-header">
          <h2>운영 리포트</h2>
          <div class="report-actions">
            <button class="ghost-button" id="printButton" type="button">인쇄 / PDF 저장</button>
            <button class="ghost-button report-close" id="reportClose" type="button">닫기</button>
          </div>
        </div>
        <div id="reportBody" class="report-body"></div>
      </div>
    </div>

    <!-- 타임랩스 모달 -->
    <div id="timelapseModal" class="tl-modal" hidden>
      <div class="tl-modal-inner">
        <div class="tl-header">
          <span id="tlFrameTitle" class="tl-title">-</span>
          <button id="tlCloseBtn" class="tl-close" type="button" aria-label="닫기">✕</button>
        </div>
        <div class="tl-stage">
          <img id="tlImage" class="tl-image" src="" alt="" />
        </div>
        <div class="tl-footer">
          <span id="tlDateLabel" class="tl-date">-</span>
          <span id="tlCounter" class="tl-counter">- / -</span>
        </div>
        <div class="tl-controls">
          <button id="tlPrevBtn" class="tl-btn" type="button">◀</button>
          <button id="tlPlayBtn" class="tl-btn tl-play" type="button">▶</button>
          <button id="tlNextBtn" class="tl-btn" type="button">▶▶</button>
        </div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>

    <script>
      // TopBar nav tab interaction
      document.getElementById('topbarNav')?.addEventListener('click', (e) => {
        const btn = e.target.closest('.topbar-tab');
        if (!btn) return;
        document.querySelectorAll('.topbar-tab').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
      });
    </script>
  </body>
</html>
