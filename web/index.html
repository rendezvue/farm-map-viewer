<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FARMILY 작물 맵</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- ── 왼쪽 사이드바 ─────────────────────────────────────────────── -->
      <aside class="sidebar">
        <!-- 작물 검출 현황 -->
        <section class="panel panel-crop" id="cropPanel">
          <div class="panel-head">
            <h2>작물 검출 현황</h2>
            <span class="demo-badge">DEMO</span>
          </div>
          <div class="crop-stats" id="cropStats"></div>
          <div class="crop-chart-wrap">
            <div class="crop-chart-title">최근 30일 추이</div>
            <div id="cropChart" class="crop-chart"></div>
            <div class="crop-chart-legend" id="cropChartLegend"></div>
          </div>
        </section>

        <div class="sidebar-report">
          <button id="reportButton" type="button" class="report-btn">리포트</button>
        </div>

        <!-- 세션 선택 -->
        <section class="panel panel-session">
          <div class="panel-head">
            <h2>Sessions</h2>
            <span class="session-status" id="datasetSummary">로딩 중…</span>
          </div>
          <div id="deviceTabs"></div>
          <div class="session-list" id="sessionList"></div>
        </section>

        <!-- 알림 패널 -->
        <section class="panel panel-alerts" id="alertsPanel" hidden>
          <div class="panel-head">
            <h2>Alerts</h2>
            <span class="pill" id="alertCountPill">0</span>
          </div>
          <div class="alert-list" id="alertList"></div>
        </section>

      </aside>

      <!-- ── 맵 스테이지 ────────────────────────────────────────────────── -->
      <main class="map-stage">
        <section class="map-card">
          <div id="mapViewport" class="map-viewport">
            <div id="tilePane" class="tile-pane"></div>
            <div id="detailPane" class="detail-pane"></div>
            <div id="annotationPane" class="annotation-pane"></div>
            <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
            <div id="segmentTooltip" class="segment-tooltip" hidden></div>
            <div class="hud">
              <div class="hud-card">
                <span class="hud-label">Zoom</span>
                <strong id="zoomValue">-</strong>
              </div>
              <div class="hud-card">
                <span class="hud-label">Scale</span>
                <strong id="scaleValue">-</strong>
              </div>
            </div>
            <div class="map-tip">
              휠로 확대/축소 · 드래그로 이동 · 클릭으로 프레임/구간 확인
            </div>
          </div>
        </section>
      </main>

      <!-- ── 우측 패널: 레이어 + 오늘 할 일 ──────────────────────────── -->
      <aside class="right-panel">
        <section class="panel panel-layers" id="layersPanel" hidden>
          <div class="panel-head">
            <h2>맵 오버레이 레이어</h2>
            <span class="demo-badge">DEMO</span>
          </div>
          <div class="layers-list" id="layersList"></div>
          <div class="layer-legend" id="layerLegend"></div>
          <div class="layer-summary" id="layerSummary" hidden></div>
          <div id="segmentDetail" class="segment-detail" hidden></div>
        </section>

        <section class="panel panel-tasks" id="tasksPanel" hidden>
          <div class="panel-head">
            <h2>오늘 할 일</h2>
            <div class="panel-head-right">
              <span class="demo-badge">DEMO</span>
              <span class="pill" id="taskCountPill">0</span>
            </div>
          </div>
          <div class="task-filter-row" id="taskFilterRow">
            <button class="task-filter-btn is-active" data-filter="active" type="button">미완료</button>
            <button class="task-filter-btn" data-filter="all" type="button">전체</button>
            <button class="task-filter-btn" data-filter="done" type="button">완료</button>
          </div>
          <div class="task-list" id="taskList"></div>
        </section>
      </aside>
    </div>

    <!-- 리포트 모달 -->
    <div id="reportModal" class="report-modal" hidden>
      <div class="report-modal-backdrop" id="reportBackdrop"></div>
      <div class="report-modal-content" id="reportContent">
        <div class="report-header">
          <h2>운영 리포트</h2>
          <div class="report-actions">
            <button class="ghost-button" id="printButton" type="button">인쇄 / PDF 저장</button>
            <button class="ghost-button report-close" id="reportClose" type="button">닫기</button>
          </div>
        </div>
        <div id="reportBody" class="report-body"></div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
